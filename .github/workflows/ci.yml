name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same gates as `pnpm verify`, minus the workflow linters, which run in their own job.
      - run: pnpm verify:ci

  consumer:
    name: Consumer (Node 22.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the library
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
        working-directory: packages/hl7-to-fhir
      # Contributors need Node 22.18 for the build tooling; consumers only need the library floor, Node 22.12.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install the tarball and load it as ESM and CommonJS
        run: | # zizmor: ignore[adhoc-packages]
          node --version
          cd "$(mktemp -d)"
          npm init --yes > /dev/null
          npm install --save-exact "$RUNNER_TEMP"/pack/hl7-to-fhir-*.tgz
          node --input-type=module --eval 'await import("hl7-to-fhir");'
          node --input-type=commonjs --eval 'require("hl7-to-fhir");'
          node --input-type=module --eval 'const { parse } = await import("hl7-to-fhir/hl7v2"); if (!parse("MSH|^~\\&|A").ok) process.exit(1);'
          node --input-type=commonjs --eval 'const { parse } = require("hl7-to-fhir/hl7v2"); if (!parse("MSH|^~\\&|A").ok) process.exit(1);'

  commits:
    name: Every commit passes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commit-messages.mjs "origin/$BASE_REF"
      # Replays the commits onto the base branch, as the rebase merge will, and runs the fast gates on each one.
      # The throwaway committer identity only exists in this checkout; nothing is pushed.
      - name: Run the fast gates on every commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          git -c user.name=ci -c user.email=ci@invalid
          rebase --exec "pnpm install --frozen-lockfile && pnpm verify:fast" "origin/$BASE_REF"

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset when the library sources change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- packages/hl7-to-fhir/src; then
            echo "The library sources are unchanged; no changeset needed."
          else
            pnpm changeset status --since="origin/$BASE_REF"
          fi

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Nothing is installed in this job, so there is no pnpm store to cache; caching would fail in the post step.
          package-manager-cache: false
      # actionlint (Go) and zizmor (Python) run through the toolchains preinstalled on the runner.
      - run: pnpm lint:workflows
        env:
          GH_TOKEN: ${{ github.token }}
