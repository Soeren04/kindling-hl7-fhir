name: Release

# Publishes hl7-to-fhir to npm when a maintainer pushes a release tag (see CONTRIBUTING.md#releases).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# No dependency caching anywhere in this workflow: a poisoned cache must never reach a publishing job.
jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history is needed to check that the tagged commit is part of main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main; only reviewed commits may be released."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: npm publish
        working-directory: packages/hl7-to-fhir
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    name: Install the published package
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install from npm and load it as ESM and CommonJS
        env:
          TAG: ${{ github.ref_name }}
        run: | # zizmor: ignore[adhoc-packages]
          version="${TAG#v}"
          cd "$(mktemp -d)"
          npm init --yes > /dev/null
          # The registry can take a moment to serve a version that was just published. Installing outside a
          # lockfile is the point of this job: it checks exactly what users get from npm.
          for attempt in 1 2 3 4 5 6; do
            npm install --save-exact "hl7-to-fhir@$version" && npm audit signatures && break
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 20
          done
          node --input-type=module --eval 'await import("hl7-to-fhir");'
          node --input-type=commonjs --eval 'require("hl7-to-fhir");'
