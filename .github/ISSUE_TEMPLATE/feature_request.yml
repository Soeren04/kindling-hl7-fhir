name: Feature request
description: Suggest an improvement to the library, the CLI or the playground.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never post real patient data.** Issues are public and permanent. Only use synthetic messages or messages
        > that are fully de-identified (names, identifiers, dates, addresses, phone numbers and free text replaced).
        > If you posted real data by mistake, follow the steps in [SECURITY.md](https://github.com/Soeren04/kindling-hl7-fhir/blob/main/SECURITY.md#patient-data-posted-by-mistake).
  - type: checkboxes
    id: synthetic-data
    attributes:
      label: Data
      options:
        - label: Every message, resource and log in this issue is synthetic or fully de-identified.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could hl7-to-fhir solve it? Include an API sketch if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
